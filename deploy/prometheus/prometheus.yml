global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: "node"
    static_configs:
      - targets: ['node_exporter:9100']
  - job_name: "node_ml"
    static_configs:
      - targets: ['91.210.107.24:9100']
