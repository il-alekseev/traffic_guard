  #     - continent



  configdb:
    image: postgres:${POSTGRES_TAG}
    ports:
      - ${POSTGRES_CONFIG_VOLUME_PORT}:${POSTGRES_CONFIG_PORT}
    environment:
      - POSTGRES_USER=${POSTGRES_CONFIG_USER}
      - POSTGRES_PASSWORD=${POSTGRES_CONFIG_PASSWORD}
      - POSTGRES_KEYCLOAK_USER=${POSTGRES_KEYCLOAK_USER}
      - POSTGRES_KEYCLOAK_PASSWORD=${POSTGRES_KEYCLOAK_PASSWORD}
      - POSTGRES_KEYCLOAK_DATABASE=${POSTGRES_KEYCLOAK_DATABASE}
      - POSTGRES_GRAFANA_USER=${POSTGRES_GRAFANA_USER}
      - POSTGRES_GRAFANA_PASSWORD=${POSTGRES_GRAFANA_PASSWORD}
      - POSTGRES_GRAFANA_DATABASE=${POSTGRES_GRAFANA_DATABASE}
      - POSTGRES_BLOG_USER=${POSTGRES_BLOG_USER}
      - POSTGRES_BLOG_PASSWORD=${POSTGRES_BLOG_PASSWORD}
      - POSTGRES_BLOG_DATABASE=${POSTGRES_BLOG_DATABASE}
      - POSTGRES_ETL_USER=${POSTGRES_ETL_USER}
      - POSTGRES_ETL_PASSWORD=${POSTGRES_ETL_PASSWORD}
      - POSTGRES_ETL_DATABASE=${POSTGRES_ETL_DATABASE}
      - POSTGRES_WEB_USER=${POSTGRES_WEB_USER}
      - POSTGRES_WEB_PASSWORD=${POSTGRES_WEB_PASSWORD}
      - POSTGRES_WEB_DATABASE=${POSTGRES_WEB_DATABASE}
      - POSTGRES_ML_USER=${POSTGRES_ML_USER}
      - POSTGRES_ML_PASSWORD=${POSTGRES_ML_PASSWORD}
      - POSTGRES_ML_DATABASE=${POSTGRES_ML_DATABASE}
    volumes:
      - ./postgres_config/data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_CONFIG_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: [
      "sh", "-c",
      "echo \"CREATE USER $POSTGRES_KEYCLOAK_USER WITH PASSWORD '$POSTGRES_KEYCLOAK_PASSWORD';\n\" > /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE USER $POSTGRES_GRAFANA_USER WITH PASSWORD '$POSTGRES_GRAFANA_PASSWORD';\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE USER $POSTGRES_BLOG_USER WITH PASSWORD '$POSTGRES_BLOG_PASSWORD';\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE USER $POSTGRES_ETL_USER WITH PASSWORD '$POSTGRES_ETL_PASSWORD';\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE USER $POSTGRES_WEB_USER WITH PASSWORD '$POSTGRES_WEB_PASSWORD';\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE USER $POSTGRES_ML_USER WITH PASSWORD '$POSTGRES_ML_PASSWORD';\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_KEYCLOAK_DATABASE OWNER $POSTGRES_KEYCLOAK_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_GRAFANA_DATABASE OWNER $POSTGRES_GRAFANA_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_BLOG_DATABASE OWNER $POSTGRES_BLOG_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_ETL_DATABASE OWNER $POSTGRES_ETL_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_WEB_DATABASE OWNER $POSTGRES_WEB_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_ML_DATABASE OWNER $POSTGRES_ML_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      docker-entrypoint.sh postgres "
    ]
    networks:
      - continent


  grafana:
    image: grafana/grafana:${GRAFANA_TAG}
    ports:
      - ${GRAFANA_VOLUME_PORT}:${GRAFANA_PORT}
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_DATABASE_TYPE=${GRAFANA_DATABASE_TYPE}
      - GF_DATABASE_HOST=${GRAFANA_DATABASE_HOST}
      - GF_DATABASE_NAME=${GRAFANA_DATABASE_NAME}
      - GF_DATABASE_USER=${GRAFANA_DATABASE_USER}
      - GF_DATABASE_PASSWORD=${GRAFANA_DATABASE_PASSWORD}
      - GF_DATABASE_SSL_MODE=disable
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=${GRAFANA_GENERIC_OAUTH_NAME}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_GENERIC_OAUTH_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_GENERIC_OAUTH_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=${GRAFANA_GENERIC_OAUTH_SCOPES}
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=${GRAFANA_IP_KEYCLOAK}/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${GRAFANA_IP_KEYCLOAK}/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=${GRAFANA_IP_KEYCLOAK}/userinfo
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'SA') && 'GrafanaAdmin' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_ORG_ATTRIBUTE_PATH=roles
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=${GRAFANA_CERT_FILE}
      - GF_SERVER_CERT_KEY=${GRAFANA_CERT_KEY}
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE=true
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana:/etc/grafana/certs
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost:${GRAFANA_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    depends_on:
      configdb:
        condition: service_healthy
    networks:
      - continent

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG}
    # build:
    #   context: ../patch-keycloak
    #   dockerfile: Dockerfile
    # image: keycloak-webhook
    ports:
      - ${KEYCLOAK_VOLUME_PORT}:${KEYCLOAK_PORT}
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_PROXY_ADDRESS_FORWARDING=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME}
      - KC_HOSTNAME_PORT=${KEYCLOAK_HOSTNAME_PORT}
      - KC_HTTPS_CERTIFICATE_FILE=${KEYCLOAK_HTTPS_CERTIFICATE_FILE}
      - KC_HTTPS_CERTIFICATE_KEY_FILE=${KEYCLOAK_HTTPS_CERTIFICATE_KEY_FILE}
      - KC_HTTP_ENABLED=false
      - KC_HTTPS_ENABLED=true
      - KC_DB=${KEYCLOAK_DB}
      - KC_DB_URL=${KEYCLOAK_DB_URL}
      - KC_DB_USERNAME=${KEYCLOAK_DB_USERNAME}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KEYCLOAK_GRAFANA_ID=${KEYCLOAK_GRAFANA_ID}
      - KEYCLOAK_GRAFANA_SECRET=${KEYCLOAK_GRAFANA_SECRET}
      - KEYCLOAK_GRAFANA_REDIRECT_ONE=${KEYCLOAK_GRAFANA_REDIRECT_ONE}
      - KEYCLOAK_GRAFANA_REDIRECT_TWO=${KEYCLOAK_GRAFANA_REDIRECT_TWO}
      - KEYCLOAK_GRAFANA_REDIRECT_THREE=${KEYCLOAK_GRAFANA_REDIRECT_THREE}
      - KEYCLOAK_GRAFANA_PROTOCOL=${KEYCLOAK_GRAFANA_PROTOCOL}
      - KEYCLOAK_GLOBAL_PASSWORD=${KEYCLOAK_GLOBAL_PASSWORD}
      - WEBHOOK_HTTP_BASE_PATH=${WEBHOOK_HTTP_BASE_PATH}
    volumes:
      - ./keycloak/realm-import.json:/opt/keycloak/data/import/realm-import.json
      - ./keycloak:/certs
      - ./keycloak/data:/opt/keycloak/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "echo -n > /dev/tcp/localhost/${KEYCLOAK_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    command: start --https-certificate-file=/certs/fullchain.crt --https-certificate-key-file=/certs/keycloak.key --import-realm --verbose
    depends_on:
      configdb:
        condition: service_healthy
    networks:
      - continent

  node_exporter:
    image: prom/node-exporter:${NODE_TAG}
    container_name: node_exporter
    ports:
      - ${NODE_VOLUME_PORT}:${NODE_PORT}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${NODE_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    networks:
      - continent

  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG}
    container_name: prometheus
    ports:
      - ${PROMETHEUS_VOLUME_PORT}:${PROMETHEUS_PORT}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/data:/prometheus
    environment:
      - PROMETHEUS_PROMETHEUS_TARGETS=${PROMETHEUS_PROMETHEUS_TARGETS}
      - PROMETHEUS_NODEEXPORTER_TARGETS=${PROMETHEUS_NODEEXPORTER_TARGETS}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PROMETHEUS_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      node_exporter:
        condition: service_healthy
    networks:
      - continent

  tg-blog:
    container_name: ${BLOG_APP_NAME}
    build:
      context: ../src/go/blog
      dockerfile: "build/Dockerfile"
    image: ${BLOG_APP_NAME}:1.0.1
    restart: always
    ports:
      - 8004:8004
    env_file: .env
    networks:
      - continent
  
  tg-usercontrol:
    container_name: tg-usercontrol
    build:
      context: ../src/go/usrctrl
      dockerfile: "build/Dockerfile"
    image: ${USER_CTRL_IMAGE_NAME}
    ports:
      - 8002:8002
    restart: always
    env_file: .env
    networks:
      - continent

  api-gw:
    container_name: ${API_GW_IMAGE_NAME}
    build:
      context: ../src/go/api-gw
      dockerfile: "build/Dockerfile"
    image: ${API_GW_IMAGE_NAME}
    ports:
      - '${API_GW_HTTP_PORT}:${API_GW_HTTP_PORT}'
    restart: always
    env_file: .env
    networks:
      - continent

  tg-dbd:
    container_name: tg-dbd
    build:
      context: ../src/go/tg-dbd
      dockerfile: "build/Dockerfile"
    image: tg-dbd
    ports:
      - '${DBD_HTTP_PORT}:${DBD_HTTP_PORT}'
    restart: always
    env_file: .env
    networks:
      - continent
  
  tg-etl:
    container_name: tg-etl
    build:
      context: ../src/go/tg-etl
      dockerfile: "build/Dockerfile"
    image: tg-etl
    ports:
      - '${ETL_HTTP_PORT}:${ETL_HTTP_PORT}'
    restart: always
    env_file: .env
    networks:
      - continent

networks:
  continent:
    driver: bridge
