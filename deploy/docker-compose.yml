  #   #   echo \"CREATE DATABASE $POSTGRES_KSU_DATABASE OWNER $POSTGRES_KSU_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
  #   #   docker-entrypoint.sh postgres "
  #   # ]
  #   networks:
  #     - continent



  configdb:
    image: postgres:${POSTGRES_TAG}
    ports:
      - ${POSTGRES_CONFIG_VOLUME_PORT}:${POSTGRES_CONFIG_PORT}
    env_file: ./postgres_config/.env
    volumes:
      - ./postgres_config/data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: [
      "sh", "-c",
      "echo \"CREATE USER $POSTGRES_KEYCLOAK_USER WITH PASSWORD '$POSTGRES_KEYCLOAK_PASSWORD';\n\" > /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE USER $POSTGRES_GRAFANA_USER WITH PASSWORD '$POSTGRES_GRAFANA_PASSWORD';\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE USER $POSTGRES_BLOG_USER WITH PASSWORD '$POSTGRES_BLOG_PASSWORD';\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE USER $POSTGRES_ETL_USER WITH PASSWORD '$POSTGRES_ETL_PASSWORD';\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE USER $POSTGRES_WEB_USER WITH PASSWORD '$POSTGRES_WEB_PASSWORD';\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE USER $POSTGRES_ML_USER WITH PASSWORD '$POSTGRES_ML_PASSWORD';\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_KEYCLOAK_DATABASE OWNER $POSTGRES_KEYCLOAK_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_GRAFANA_DATABASE OWNER $POSTGRES_GRAFANA_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_BLOG_DATABASE OWNER $POSTGRES_BLOG_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_ETL_DATABASE OWNER $POSTGRES_ETL_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_WEB_DATABASE OWNER $POSTGRES_WEB_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      echo \"CREATE DATABASE $POSTGRES_ML_DATABASE OWNER $POSTGRES_ML_USER ;\n\" >> /docker-entrypoint-initdb.d/init.sql &&
      docker-entrypoint.sh postgres "
    ]
    networks:
      - continent

  grafana:
    image: grafana/grafana:${GRAFANA_TAG}
    ports:
      - ${GRAFANA_VOLUME_PORT}:${GRAFANA_PORT}
    env_file: ./grafana/.env
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana:/etc/grafana/certs
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost:${GRAFANA_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 35s
    depends_on:
      configdb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - continent

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG}
    # build:
    #   context: ../patch-keycloak
    #   dockerfile: Dockerfile
    # image: keycloak-webhook
    ports:
      - ${KEYCLOAK_VOLUME_PORT}:${KEYCLOAK_PORT}
    env_file: ./keycloak/.env
    volumes:
      - ./keycloak/realm-import.json:/opt/keycloak/data/import/realm-import.json
      - ./keycloak:/certs
      - ./keycloak/data:/opt/keycloak/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "echo -n > /dev/tcp/localhost/${KEYCLOAK_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    command: start --https-certificate-file=/certs/fullchain.crt --https-certificate-key-file=/certs/keycloak.key --import-realm --verbose
    depends_on:
      configdb:
        condition: service_healthy
    networks:
      - continent

  node_exporter:
    image: prom/node-exporter:${NODE_TAG}
    container_name: node_exporter
    ports:
      - ${NODE_VOLUME_PORT}:${NODE_PORT}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${NODE_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    networks:
      - continent

  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG}
    container_name: prometheus
    ports:
      - ${PROMETHEUS_VOLUME_PORT}:${PROMETHEUS_PORT}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/data:/prometheus
    environment:
      - PROMETHEUS_PROMETHEUS_TARGETS=${PROMETHEUS_PROMETHEUS_TARGETS}
      - PROMETHEUS_NODEEXPORTER_TARGETS=${PROMETHEUS_NODEEXPORTER_TARGETS}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PROMETHEUS_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      node_exporter:
        condition: service_healthy
    networks:
      - continent

  tg-blog:
    container_name: ${BLOG_APP_NAME}
    build:
      context: ../src/go/blog
      dockerfile: "build/Dockerfile"
    ports:
      - ${BLOG_HTTP_PORT}:${BLOG_HTTP_PORT}
    env_file: ./tg-blog/.env
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${BLOG_HTTP_PORT}/api/v1/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      configdb:
        condition: service_healthy
    networks:
      - continent
  
  tg-usercontrol:
    container_name: ${USER_CTRL_APP_NAME}
    build:
      context: ../src/go/userctrl
      dockerfile: "build/Dockerfile"
    ports:
      - ${USER_CTRL_HTTP_PORT}:${USER_CTRL_HTTP_PORT}
    restart: always
    env_file: ./tg-usercontrol/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${USER_CTRL_HTTP_PORT}/v1/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    depends_on:
      configdb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks:
      - continent

  api-gw:
    container_name: ${API_GW_IMAGE_NAME}
    build:
      context: ../src/go/api-gw
      dockerfile: "build/Dockerfile"
    ports:
      - ${API_GW_HTTP_PORT}:${API_GW_HTTP_PORT}
    env_file: ./api-gw/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_GW_HTTP_PORT}/api/v1/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 35s
    restart: always
    depends_on:
      tg-usercontrol:
        condition: service_healthy
      tg-an:
        condition: service_healthy
    networks:
      - continent

  tg-an:
    container_name: tg-an
    build:
      context: ../src/go/tg-analytics
      dockerfile: "build/Dockerfile"
    ports:
      - ${AN_HTTP_PORT}:${AN_HTTP_PORT}
    restart: always
    env_file: ./tg-an/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${AN_HTTP_PORT}/api/v1/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    depends_on:
      configdb:
        condition: service_healthy
      tg-etl:
        condition: service_healthy
    networks:
      - continent
  
  tg-etl:
    container_name: tg-etl
    build:
      context: ../src/go/tg-etl
      dockerfile: "build/Dockerfile"
    ports:
      - '${ETL_HTTP_PORT}:${ETL_HTTP_PORT}'
    env_file: ./tg-etl/.env
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${ETL_HTTP_PORT}/api/v1/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    depends_on:
      configdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - continent

  webscraper:
    build:
      context: ../src/go/webscraper
      dockerfile: deploy/Dockerfile
    container_name: webscraper
    env_file: ./webscraper/.env
    volumes:
      - ./webscraper/config:/app/config:ro
      - ./webscraper/docs:/app/docs:ro
      - ./webscraper/data:/app/data:ro
    ports:
      - ${SCR_HTTP_PORT}:${SCR_HTTP_PORT}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8010/helth_check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - continent

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ${ZOO_APP_NAME}
    ports:
      - ${ZOO_PORT}:${ZOO_PORT}
    volumes:
      - ./zookeeper/data:/var/lib/zookeeper/data
      - ./zookeeper/log:/var/lib/zookeeper/log
    env_file: ./zookeeper/.env
    healthcheck:
      test: ["CMD", "bash", "-c", "echo stat | nc localhost ${ZOO_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - continent


  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ${KAFKA_APP_NAME}
    ports:
      - ${KAFKA_HTTP_PORT}:${KAFKA_HTTP_PORT}
    volumes:
      - ./kafka/data:/var/lib/kafka/data
      - ./kafka/init_topics.sh:/tmp/init-topics.sh
    env_file: ./kafka/.env 
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server localhost:${KAFKA_HTTP_PORT} --list && /tmp/init-topics.sh"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 40s
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy   
    networks:
      - continent

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ${KAFKAUI_APP_NAME}
    ports:
      - ${KAFKAUI_VOLUME_PORT}:${KAFKAUI_PORT}
    env_file: ./kafka_ui/.env
    volumes:
      - ./kafka_ui/data:/etc/kafka-ui
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${KAFKAUI_PORT}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - continent
  
  # neuro:
  #   container_name: ${NEURO_APP_NAME}
  #   build:
  #     context: ../src/python/neuro
  #     dockerfile: deploy/Dockerfile
  #   env_file: ./neuro/.env
  #   depends_on:
  #     kafka:
  #       condition: service_healthy  
  #     configdb:
  #       condition: service_healthy
  #   restart: always
  #   networks:
  #     - continent 

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../traffic_guard-front/certs:/etc/nginx/certs
    depends_on:
      api-gw:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f","-k", "https://localhost:443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - continent
  
  frontend:
    build:
      context: ../traffic_guard-front
      dockerfile: Dockerfile
      target: production
    ports:
      - "${APP_PORT_HOST:-3001}:${APP_PORT_CONTAINER:-3001}"
    env_file:
      - ./frontend/.env
    environment:
      HOST: "${APP_HOST:-0.0.0.0}" 
      PORT: "${APP_PORT_CONTAINER:-3001}"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - continent

networks:
  continent:
    driver: bridge
