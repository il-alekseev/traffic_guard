        type: array
      output:
        description: output
        items:
          type: integer
        type: array
      time:
        description: time
        items:
          type: string
        type: array
    type: object
  models.ModelsUser:
    properties:
      created_at:
        description: |-
          created at
          Example: 2023-04-01T12:00:00Z
        type: string
      email:
        description: |-
          email
          Example: john.doe@example.com
        type: string
      first_name:
        description: |-
          first name
          Example: John
        type: string
      is_need_to_change_password:
        description: |-
          is need to change password
          Example: true
        type: boolean
      is_super_admin:
        description: |-
          is super admin
          Example: false
        type: boolean
      last_name:
        description: |-
          last name
          Example: Doe
        type: string
      login:
        description: |-
          login
          Example: johndoe
        type: string
      patronymic:
        description: |-
          patronymic
          Example: Ivanovich
        type: string
      role:
        description: |-
          role
          Example: SA
        type: string
      user_id:
        description: |-
          user id
          Example: a71032a2-87eb-4d4e-a2a0-d86404672799
        type: string
    type: object
host: localhost:8001
info:
  contact: {}
  title: API Gw
  version: "1.0"
paths:
  /v1/analytics/categories:
    get:
      description: Получение списка всех категорий контента
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Ошибка при получении списка категорий
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение списка категорий контента
      tags:
      - common
  /v1/analytics/dashboards/requests:
    get:
      consumes:
      - application/json
      description: Возвращает статистику запросов за указанный период с фильтрацией
        по статусу, хосту и категории
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, now-1h, 2024-01-01T00:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2024-01-01T00:00:00Z)'
        in: query
        name: to
        type: string
      - default: prohibited
        description: Статус запросов (allowed, blocked, prohibited, waiting)
        in: query
        name: status
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по категории
        enum:
        - Агрессия
        - расизм
        - терроризм
        - Ботнеты
        - Веб-почта
        - Досуг и развлечения
        - Интернет-магазины
        - Компьютерные игры
        - Криптомайнинг
        - Наркотики
        - Порнография и секс
        - Прокси и анонимайзеры
        - Реестр запрещенных сайтов
        - Сайты для взрослых
        - Сайты
        - распространяющие вирусы
        - Социальные сети
        - Торренты и Р2Р-сети
        - Файловые архивы
        - Фильмы и видео онлайн
        - Фишинг
        - Чаты и мессенджеры
        - Дополнительно
        - Криптоджекинг
        - Реклама
        - Онлайн-игры
        - Игровые платформы
        - Вредоносное ПО
        - Азартные игры
        - Депресивный контент и суицид
        - Алкоголь
        - табак
        in: query
        name: category
        type: string
      - default: 10
        description: Количество интервалов
        in: query
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Статистика запросов (массив чисел)
          schema:
            items:
              type: integer
            type: array
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить статистику запросов
      tags:
      - dashboards
  /v1/analytics/dashboards/top-categories:
    get:
      consumes:
      - application/json
      description: Возвращает наиболее часто встречаемые категории в сессиях с возможностью
        фильтрации
      parameters:
      - default: now-24h
        description: Начало временного диапазона
        in: query
        name: from
        type: string
      - default: now
        description: Конец временного диапазона
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по типу сессии
        enum:
        - Заблокирован
        - Запрещен
        - Ожидает
        - Разрешен
        in: query
        name: type
        type: string
      - default: 5
        description: Количество возвращаемых категорий
        in: query
        maximum: 50
        minimum: 1
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/models.ModelsCategoryCount'
              type: array
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить топ категорий сессий
      tags:
      - dashboards
  /v1/analytics/dashboards/traffic:
    get:
      consumes:
      - application/json
      description: Возвращает статистику трафика за указанный временной диапазон с
        заданным количеством точек данных в Кб
      parameters:
      - default: now-10m
        description: Начало временного диапазона в формате парсера времени (по умолчанию
          now-10m)
        in: query
        name: from
        type: string
      - default: now
        description: Конец временного диапазона в формате парсера времени (по умолчанию
          now)
        in: query
        name: to
        type: string
      - default: 20
        description: Количество точек данных для возврата (по умолчанию 20)
        in: query
        minimum: 1
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ со статистикой трафика
          schema:
            $ref: '#/definitions/models.DtoTrafficStatResponse'
        "400":
          description: Неверный формат параметров запроса
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Внутренняя ошибка сервера при получении статистики
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить статистику трафика
      tags:
      - dashboards
  /v1/analytics/detections:
    get:
      consumes:
      - application/json
      description: Возвращает список наиболее частых детекций за указанный временной
        период с пагинацией
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, 2023-12-01T10:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2023-12-01T11:00:00Z)'
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по категории
        enum:
        - Агрессия
        - расизм
        - терроризм
        - Ботнеты
        - Веб-почта
        - Досуг и развлечения
        - Интернет-магазины
        - Компьютерные игры
        - Криптомайнинг
        - Наркотики
        - Порнография и секс
        - Прокси и анонимайзеры
        - Реестр запрещенных сайтов
        - Сайты для взрослых
        - Сайты
        - распространяющие вирусы
        - Социальные сети
        - Торренты и Р2Р-сети
        - Файловые архивы
        - Фильмы и видео онлайн
        - Фишинг
        - Чаты и мессенджеры
        - Дополнительно
        - Криптоджекинг
        - Реклама
        - Онлайн-игры
        - Игровые платформы
        - Вредоносное ПО
        - Азартные игры
        - Депресивный контент и суицид
        - Алкоголь
        - табак
        in: query
        name: category
        type: string
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Количество записей на странице
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            $ref: '#/definitions/models.DtoListResponse'
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить список топ выявлений
      tags:
      - detections
  /v1/analytics/detections/stat:
    get:
      consumes:
      - application/json
      description: Возвращает статистику детекций по категориям (обнаружено, принято,
        отклонено, неразрешено) за указанный период
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, now-1h, 2024-01-01T00:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2024-01-01T00:00:00Z)'
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по категории
        enum:
        - Агрессия
