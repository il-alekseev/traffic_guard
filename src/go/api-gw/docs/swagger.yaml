host: localhost:8001
info:
  contact: {}
  title: API Gw
  version: "1.0"
paths:
  /api/v1/analytics/categories:
    get:
      description: Возвращает список всех уникальных категорий контента из системы
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Ошибка при получении списка категорий
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение списка категорий контента
      tags:
      - common
  /api/v1/analytics/dashboards/act:
    patch:
      consumes:
      - application/json
      description: Устанавливает действие (разрешить/заблокировать) для указанного
        домена
      parameters:
      - default: allow
        description: Тип действия
        enum:
        - allow
        - deny
        in: query
        name: action
        required: true
        type: string
      - description: Путь домена
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
