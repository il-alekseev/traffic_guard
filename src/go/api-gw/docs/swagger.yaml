        - Реестр запрещенных сайтов
        - Сайты для взрослых
        - Сайты
        - распространяющие вирусы
        - Социальные сети
        - Торренты и Р2Р-сети
        - Файловые архивы
        - Фильмы и видео онлайн
        - Фишинг
        - Чаты и мессенджеры
        - Дополнительно
