  /v1/analytics/sessions:
    get:
      consumes:
      - application/json
      description: Возвращает список сессий с возможностью фильтрации, поиска, сортировки
        и пагинации
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, 2023-12-01T10:00:00Z).
          По умолчанию: now-10m'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2023-12-01T12:00:00Z).
          По умолчанию: now'
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по категории
        enum:
        - Агрессия
        - расизм
        - терроризм
        - Ботнеты
        - Веб-почта
        - Досуг и развлечения
        - Интернет-магазины
        - Компьютерные игры
        - Криптомайнинг
        - Наркотики
        - Порнография и секс
        - Прокси и анонимайзеры
        - Реестр запрещенных сайтов
        - Сайты для взрослых
        - Сайты
        - распространяющие вирусы
        - Социальные сети
        - Торренты и Р2Р-сети
        - Файловые архивы
        - Фильмы и видео онлайн
        - Фишинг
        - Чаты и мессенджеры
        - Дополнительно
        - Криптоджекинг
        - Реклама
        - Онлайн-игры
        - Игровые платформы
        - Вредоносное ПО
        - Азартные игры
        - Депресивный контент и суицид
        - Алкоголь
        - табак
        in: query
        name: category
        type: string
      - description: Фильтр по типу сессии
        enum:
        - Заблокирован
        - Запрещен
        - Ожидает
        - Разрешен
        in: query
        name: type
        type: string
      - description: Поиск по частичному совпадению
        in: query
        name: search
        type: string
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Количество записей на странице
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: id
        description: Поле для сортировки
        enum:
        - id
        - datetime_utc
        - type
        - status
        - url
        - proto
        - host_name
        - src_ip
        - src_port
        - src_country
        - username
        - dst_ip
        - dst_port
        - dst_country
        - category
        in: query
        name: order_by
        type: string
      - default: desc
        description: Направление сортировки (asc/desc)
        enum:
        - asc
        - desc
        in: query
        name: order_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            $ref: '#/definitions/models.DtoListResponse'
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить список сессий
      tags:
      - sessions
