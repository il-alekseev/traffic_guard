basePath: /
definitions:
  models.DtoContextListResponse:
    properties:
      data:
        description: Список контекстов
        items:
          $ref: '#/definitions/models.ModelsContext'
        type: array
      meta:
        description: Метаданные пагинации
        properties:
          limit:
            description: Количество элементов на странице
            type: integer
          page:
            description: Текущая страница (начинается с 1)
            type: integer
          pages:
            description: Общее количество страниц
            type: integer
          total:
            description: Общее количество элементов
            type: integer
        type: object
    type: object
  models.DtoCountResponse:
    properties:
      count:
        description: count
        type: integer
    type: object
  models.DtoCountUserByRoleResponse:
    properties:
      count_ca:
        description: count ca
        type: integer
      count_co:
        description: count co
        type: integer
      count_sa:
        description: count sa
        type: integer
    type: object
  models.DtoCreateContextRequest:
    properties:
      description:
        description: Описание контекста
        type: string
      id:
        description: Уникальный идентификатор контекста (первичный ключ в БД)
        type: string
      logs_limits:
        description: Лимиты для логов
        properties:
          disk_storage:
            description: disk storage
            type: integer
          retention_duration:
            description: retention duration
            type: integer
        type: object
      metric_limits:
        description: Лимиты для метрик
        properties:
          disk_storage:
            description: disk storage
            type: integer
          retention_duration:
            description: retention duration
            type: integer
        type: object
      name:
        description: Уникальное имя контекста
        type: string
      port:
        description: Уникальный порт для получения метрик
        type: integer
      transport:
        description: Протокол транспортного уровня для получения метрик
        type: string
    type: object
  models.DtoDetectionStat:
    properties:
      accepted:
        description: accepted
        type: integer
      denied:
        description: denied
        type: integer
      detected:
        description: detected
        type: integer
      unresolved:
        description: unresolved
        type: integer
    type: object
  models.DtoErrorResponse:
    properties:
      error:
        description: Описание ошибки
        type: string
    type: object
  models.DtoListResponse:
    properties:
      data:
        description: Список однотипных данных
      meta:
        description: Метаданные пагинации
        properties:
          limit:
            description: Количество элементов на странице
            type: integer
          page:
            description: Текущая страница (начинается с 1)
            type: integer
          pages:
            description: Общее количество страниц
            type: integer
          total:
            description: Общее количество элементов
            type: integer
        type: object
    type: object
  models.DtoLogUser:
    properties:
      login:
        description: |-
          login
          Required: true
        type: string
      password:
        description: |-
          password
          Required: true
        type: string
    type: object
  models.DtoPaginationMeta:
    properties:
      limit:
        description: Количество элементов на странице
        type: integer
      page:
        description: Текущая страница (начинается с 1)
        type: integer
      pages:
        description: Общее количество страниц
        type: integer
      total:
        description: Общее количество элементов
        type: integer
    type: object
  models.DtoRolesListResponse:
    properties:
      data:
        description: data
        items:
          $ref: '#/definitions/models.ModelsRole'
        type: array
      meta:
        allOf:
        - $ref: '#/definitions/models.DtoPaginationMeta'
        description: meta
    type: object
  models.DtoSuccessResponse:
    properties:
      message:
        description: message
        type: string
    type: object
  models.DtoTrafficStatResponse:
    properties:
      count:
        description: count
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/models.ModelsTrafficStat'
        description: data
    type: object
  models.DtoUpdateContextRequest:
    properties:
      description:
        description: Новое описание контекста
        type: string
      name:
        description: Новое имя контекста
        type: string
    type: object
  models.DtoUserCreateRequest:
    properties:
      email:
        description: |-
          email
          Example: john.doe@example.com
        type: string
      first_name:
        description: |-
          first name
          Example: John
          Required: true
          Max Length: 50
          Min Length: 1
        type: string
      last_name:
        description: |-
          last name
          Example: Doe
          Required: true
          Max Length: 50
          Min Length: 1
        type: string
      login:
        description: |-
          login
          Example: johndoe
          Required: true
          Max Length: 50
          Min Length: 4
        type: string
      password:
        description: |-
          password
          Required: true
          Max Length: 50
          Min Length: 4
        type: string
      patronymic:
        description: |-
          patronymic
          Example: Ivanovich
        type: string
      role:
        description: |-
          role
          Example: SA
          Required: true
        type: string
    type: object
  models.DtoUserResetPass:
    properties:
      new_password:
        description: |-
          new password
          Required: true
        type: string
    type: object
  models.DtoUserUpdateData:
    properties:
      email:
        description: email
        type: string
      first_name:
        description: first name
        type: string
      last_name:
        description: last name
        type: string
      patronymic:
        description: patronymic
        type: string
      role:
        description: role
        type: string
    type: object
  models.DtoUserUpdatePass:
    properties:
      new_password:
        description: |-
          new password
          Required: true
        type: string
      old_password:
        description: |-
          old password
          Required: true
        type: string
    type: object
  models.DtoUsersListResponse:
    properties:
      data:
        description: data
        items:
          $ref: '#/definitions/models.ModelsUser'
        type: array
      meta:
        allOf:
        - $ref: '#/definitions/models.DtoPaginationMeta'
        description: meta
    type: object
  models.DtoVectroFreePortsResponse:
    properties:
      ports:
        description: ports
        items:
          type: integer
        type: array
    type: object
  models.ModelsAPIError:
    properties:
      code:
        description: code
        type: integer
      message:
        description: message
        type: string
    type: object
  models.ModelsBusinessLog:
    properties:
      context:
        description: context
        type: string
      context_str:
        description: context str
        type: string
      description:
        description: description
        type: string
      entity:
        description: user, context
        type: string
      entity_id:
        description: userID or ContextID
        type: string
      event_type:
        description: CREATE, UPDATE, DELETE
        type: string
      id:
        description: id
        type: integer
      new_value:
        description: new value
      old_value:
        description: old value
      timestamp:
        description: timestamp
        type: string
      user_name:
        description: user name
        type: string
      user_role:
        description: SA, CA
        type: string
    type: object
  models.ModelsCategoryCount:
    properties:
      category:
        description: category
        type: string
      count:
        description: count
        type: integer
    type: object
  models.ModelsContext:
    properties:
      admins_count:
        description: admins count
        type: integer
      created_at:
        description: created at
        type: string
      description:
        description: description
        type: string
      id:
        description: id
        type: string
      log_input_port:
        description: Порт для получения метрик в Vector
        type: integer
      log_input_transport:
        description: Протокол транспортного уровня для получения метрик в Vector
        type: string
      logs_limits:
        allOf:
        - $ref: '#/definitions/models.ModelsDataLimits'
        description: logs limits
      metric_limits:
        allOf:
        - $ref: '#/definitions/models.ModelsDataLimits'
        description: metric limits
      metrics_input_port:
        description: metrics input port
        type: string
      name:
        description: name
        type: string
      operators_count:
        description: operators count
        type: integer
    type: object
  models.ModelsDataLimits:
    properties:
      disk_storage:
        description: disk storage
        type: integer
      retention_duration:
        description: retention duration
        type: integer
    type: object
  models.ModelsLogs:
    properties:
      data:
        description: data
        items:
          $ref: '#/definitions/models.ModelsBusinessLog'
        type: array
      meta:
        allOf:
        - $ref: '#/definitions/models.ModelsMeta'
        description: meta
    type: object
  models.ModelsMeta:
    properties:
      limit:
        description: limit
        type: integer
      page:
        description: page
        type: integer
      pages:
        description: pages
        type: integer
      total:
        description: total
        type: integer
    type: object
  models.ModelsRole:
    properties:
      role:
        description: |-
          role
          Required: true
        type: string
    type: object
  models.ModelsToken:
    properties:
      access_token:
        description: access token
