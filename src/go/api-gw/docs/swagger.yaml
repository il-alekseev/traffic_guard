basePath: /
definitions:
  models.DtoContextListResponse:
    properties:
      data:
        description: Список контекстов
        items:
          $ref: '#/definitions/models.ModelsContext'
        type: array
      meta:
        description: Метаданные пагинации
        properties:
          limit:
            description: limit
            type: integer
          page:
            description: page
            type: integer
          pages:
            description: pages
            type: integer
          total:
            description: total
            type: integer
        type: object
    type: object
  models.DtoCountResponse:
    properties:
      count:
        description: count
        type: integer
    type: object
  models.DtoCountUserByRoleResponse:
    properties:
      count_ca:
        description: count ca
        type: integer
      count_co:
        description: count co
        type: integer
      count_sa:
        description: count sa
        type: integer
    type: object
  models.DtoCreateContextRequest:
    properties:
      description:
        description: Описание контекста
        type: string
      id:
        description: Уникальный идентификатор контекста (первичный ключ в БД)
        type: string
      logs_limits:
        description: Лимиты для логов
        properties:
          disk_storage:
            description: disk storage
            type: integer
          retention_duration:
            description: retention duration
            type: integer
        type: object
      metric_limits:
        description: Лимиты для метрик
        properties:
          disk_storage:
            description: disk storage
            type: integer
          retention_duration:
            description: retention duration
            type: integer
        type: object
      name:
        description: Уникальное имя контекста
        type: string
      port:
        description: Уникальный порт для получения метрик
        type: integer
      transport:
        description: Протокол транспортного уровня для получения метрик
        type: string
    type: object
  models.DtoErrorResponse:
    properties:
      error:
        description: error
        type: string
    type: object
  models.DtoLogUser:
    properties:
      login:
        description: |-
          login
          Required: true
        type: string
      password:
        description: |-
          password
          Required: true
        type: string
    type: object
  models.DtoPaginationMeta:
    properties:
      limit:
        description: limit
        type: integer
      page:
        description: page
        type: integer
      pages:
        description: pages
        type: integer
      total:
        description: total
        type: integer
    type: object
  models.DtoRolesListResponse:
    properties:
      data:
        description: data
        items:
          $ref: '#/definitions/models.ModelsRole'
        type: array
      meta:
        allOf:
        - $ref: '#/definitions/models.DtoPaginationMeta'
        description: meta
    type: object
  models.DtoSuccessResponse:
    properties:
      message:
        description: message
        type: string
    type: object
  models.DtoUpdateContextRequest:
    properties:
      description:
        description: Новое описание контекста
        type: string
      name:
        description: Новое имя контекста
        type: string
    type: object
  models.DtoUserCreateRequest:
    properties:
      email:
        description: |-
          email
          Example: john.doe@example.com
        type: string
      first_name:
        description: |-
          first name
          Example: John
          Required: true
          Max Length: 50
          Min Length: 1
        type: string
      last_name:
        description: |-
          last name
          Example: Doe
          Required: true
          Max Length: 50
          Min Length: 1
        type: string
      login:
        description: |-
          login
          Example: johndoe
          Required: true
          Max Length: 50
          Min Length: 4
        type: string
      password:
        description: |-
          password
          Required: true
          Max Length: 50
          Min Length: 4
        type: string
      patronymic:
        description: |-
          patronymic
          Example: Ivanovich
        type: string
      role:
        description: |-
          role
          Example: SA
          Required: true
        type: string
    type: object
  models.DtoUserResetPass:
    properties:
      new_password:
        description: |-
          new password
          Required: true
        type: string
    type: object
  models.DtoUserUpdateData:
    properties:
      email:
        description: email
        type: string
      first_name:
        description: first name
        type: string
      last_name:
        description: last name
        type: string
      patronymic:
        description: patronymic
        type: string
      role:
        description: role
        type: string
    type: object
  models.DtoUserUpdatePass:
    properties:
      new_password:
        description: |-
          new password
          Required: true
        type: string
      old_password:
        description: |-
          old password
          Required: true
        type: string
    type: object
  models.DtoUsersListResponse:
    properties:
      data:
        description: data
        items:
          $ref: '#/definitions/models.ModelsUser'
        type: array
      meta:
        allOf:
        - $ref: '#/definitions/models.DtoPaginationMeta'
        description: meta
    type: object
  models.DtoVectroFreePortsResponse:
    properties:
      ports:
        description: ports
        items:
          type: integer
        type: array
    type: object
  models.ModelsAPIError:
    properties:
      code:
        description: code
        type: integer
      message:
        description: message
        type: string
    type: object
  models.ModelsBusinessLog:
    properties:
      context:
        description: context
        type: string
      context_str:
        description: context str
        type: string
      description:
        description: description
        type: string
      entity:
        description: user, context
        type: string
      entity_id:
        description: userID or ContextID
        type: string
      event_type:
        description: CREATE, UPDATE, DELETE
        type: string
      id:
        description: id
        type: integer
      new_value:
        description: new value
      old_value:
        description: old value
      timestamp:
        description: timestamp
        type: string
      user_name:
        description: user name
        type: string
      user_role:
        description: SA, CA
        type: string
    type: object
  models.ModelsContext:
    properties:
      admins_count:
        description: admins count
        type: integer
      created_at:
        description: created at
        type: string
      description:
        description: description
        type: string
      id:
        description: id
        type: string
      log_input_port:
        description: Порт для получения метрик в Vector
        type: integer
      log_input_transport:
        description: Протокол транспортного уровня для получения метрик в Vector
        type: string
      logs_limits:
        allOf:
        - $ref: '#/definitions/models.ModelsDataLimits'
        description: logs limits
      metric_limits:
        allOf:
        - $ref: '#/definitions/models.ModelsDataLimits'
        description: metric limits
      metrics_input_port:
        description: metrics input port
        type: string
      name:
        description: name
        type: string
      operators_count:
        description: operators count
        type: integer
    type: object
  models.ModelsDataLimits:
    properties:
      disk_storage:
        description: disk storage
        type: integer
      retention_duration:
        description: retention duration
        type: integer
    type: object
  models.ModelsLogs:
    properties:
      data:
        description: data
        items:
          $ref: '#/definitions/models.ModelsBusinessLog'
        type: array
      meta:
        allOf:
        - $ref: '#/definitions/models.ModelsMeta'
        description: meta
    type: object
  models.ModelsMeta:
    properties:
      limit:
        description: limit
        type: integer
      page:
        description: page
        type: integer
      pages:
        description: pages
        type: integer
      total:
        description: total
        type: integer
    type: object
  models.ModelsRole:
    properties:
      role:
        description: |-
          role
          Required: true
        type: string
    type: object
  models.ModelsToken:
    properties:
      access_token:
        description: access token
        type: string
      expires_in:
        description: expires in
        type: integer
      grafana_session:
        description: grafana session
        type: string
      grafana_session_expiry:
        description: grafana session expiry
        type: string
      refresh_token:
        description: refresh token
        type: string
    type: object
  models.ModelsUser:
    properties:
      created_at:
        description: |-
          created at
          Example: 2023-04-01T12:00:00Z
        type: string
      email:
        description: |-
          email
          Example: john.doe@example.com
        type: string
      first_name:
        description: |-
          first name
          Example: John
        type: string
      is_need_to_change_password:
        description: |-
          is need to change password
          Example: true
        type: boolean
      is_super_admin:
        description: |-
          is super admin
          Example: false
        type: boolean
      last_name:
        description: |-
          last name
          Example: Doe
        type: string
      login:
        description: |-
          login
          Example: johndoe
        type: string
      patronymic:
        description: |-
          patronymic
          Example: Ivanovich
        type: string
      role:
        description: |-
          role
          Example: SA
        type: string
      user_id:
        description: |-
          user id
          Example: a71032a2-87eb-4d4e-a2a0-d86404672799
        type: string
    type: object
host: localhost:8001
info:
  contact: {}
  title: API Gw
  version: "1.0"
paths:
  /v1/auth/refresh:
    post:
      description: Для успешного обновления токена пользователю необходимо передать
        валидный токен OAuth в заголовке Authorization и refresh-токен в заголовке
        X-Refresh-Token.
      parameters:
      - description: Refresh токен
        in: header
        name: X-Refresh-Token
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ModelsToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      summary: Обновление токена
      tags:
      - auth
  /v1/auth/sign-in:
    post:
      consumes:
      - application/json
      description: Для авторизации требуется логин и пароль. В случае успешной авторизации
        пользователю выдается токен OAuth. Время жизни токена 24 часа.
      parameters:
      - description: Данные для авторизации
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.DtoLogUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ModelsToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      summary: Авторизация пользователя в системе
      tags:
      - auth
  /v1/auth/sign-out:
    post:
      description: Для успешного завершения запроса пользователю необходимо передать
        валидный токен OAuth в заголовке Authorization и refresh-токен в заголовке
        X-Refresh-Token.
      parameters:
      - description: Refresh токен
        in: header
        name: X-Refresh-Token
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DtoSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Выход пользователя из системы
      tags:
      - auth
  /v1/clixon/controller/config:
    get:
      consumes:
      - application/json
      description: Возвращает xml конфигурацию, использует имя пользователя из jwt
        токена
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "401":
          description: Ошибки авторизации
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение текущей конфигурации (running) Clixon-controller
      tags:
      - clixon
  /v1/clixon/controller/devices:
    get:
      description: |-
        Возвращает статусы подключенных устройств, использует имя пользователя из jwt токена
        401 - "Invalid token format. Expected 'Bearer <token>'", "authorization header is required", "error: Authorization header is required", "error: Invalid authorization header format" ,"error: Invalid token" ,"error: Invalid token claims" ,"error: sub claim is required (user uuid)" ,"error: preferred_username claim is required (username)" ,"error: Invalid token claims" ,"Ошибки авторизации"
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Ошибки авторизации
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение статуса подключенных устройств к Clixon-controller
      tags:
      - clixon
  /v1/clixon/device/config:
    get:
      description: '401 - "Invalid token format. Expected ''Bearer <token>''", "authorization
        header is required", "error: Authorization header is required", "error: Invalid
        authorization header format" ,"error: Invalid token" ,"error: Invalid token
        claims" ,"error: sub claim is required (user uuid)" ,"error: preferred_username
        claim is required (username)" ,"error: Invalid token claims" ,"Ошибки авторизации"'
      parameters:
      - description: имя устройства
        in: query
        name: device
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Ошибки авторизации
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение конфигурации подключенного устройства
      tags:
      - clixon
  /v1/clixon/rawXml:
    post:
      description: |-
        В сообщении не должно быть заголовка rpc и сепаратора "]]>]]"
        401 - "Invalid token format. Expected 'Bearer <token>'", "authorization header is required", "error: Authorization header is required", "error: Invalid authorization header format" ,"error: Invalid token" ,"error: Invalid token claims" ,"error: sub claim is required (user uuid)" ,"error: preferred_username claim is required (username)" ,"error: Invalid token claims" ,"Ошибки авторизации"
      parameters:
      - description: xml сообщение
        in: body
        name: input
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Ошибка в теле запроса
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "401":
          description: Ошибки авторизации
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Отправка произвольного xml на clixon-controller
      tags:
      - clixon
  /v1/clixon/reconnect/device:
    get:
      description: |-
        Переподключает устройства, использует имя пользователя из jwt токена
        401 - "Invalid token format. Expected 'Bearer <token>'", "authorization header is required", "error: Authorization header is required", "error: Invalid authorization header format" ,"error: Invalid token" ,"error: Invalid token claims" ,"error: sub claim is required (user uuid)" ,"error: preferred_username claim is required (username)" ,"error: Invalid token claims" ,"Ошибки авторизации"
      parameters:
      - description: имя устройства
        in: query
        name: device
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Ошибки авторизации
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Переподключение устройств к Clixon-controller
      tags:
      - clixon
  /v1/contexts:
    get:
      consumes:
      - application/json
      description: Получение списка всех контекстов системы с возможностью пагинации
        и фильтрации
      parameters:
      - default: 1
        description: Номер страницы
        in: query
        name: page
        type: integer
      - default: 10
        description: Количество элементов на странице
        in: query
        name: limit
        type: integer
      - description: Фильтр по названию/id контекста
        in: query
        name: search
        type: string
      - default: context_id
        description: Поле для сортировки default(context_id)
        enum:
        - context_id
        - created_at
        in: query
        name: order_by
        type: string
      - default: desc
        description: Направление сортировки default(desc)
        enum:
        - asc
        - desc
        in: query
        name: order_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DtoContextListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение списка всех контекстов в системе
      tags:
      - contexts
    post:
      consumes:
      - text/plain
      description: Создание нового контекста с указанным названием
      parameters:
      - description: Название контекста
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.DtoCreateContextRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ModelsContext'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Добавление нового контекста в систему
      tags:
      - contexts
  /v1/contexts/{context_id}:
    delete:
      consumes:
      - application/json
      description: Удаление контекста по его ID
      parameters:
      - description: ID контекста
        in: path
        name: context_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DtoSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Удаление контекста
      tags:
      - contexts
    get:
      consumes:
      - application/json
      description: Получение информации о контексте по его ID
      parameters:
      - description: ID контекста
        in: path
        name: context_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ModelsContext'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение контекста по его идентификатору
      tags:
      - contexts
    put:
      consumes:
      - application/json
      description: Обновление названия контекста и/или описания
      parameters:
      - description: ID контекста
        in: path
        name: context_id
        required: true
        type: string
      - description: Информация о контексте
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.DtoUpdateContextRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DtoCountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.DtoErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновление контекста по его идентификатору
      tags:
      - contexts
  /v1/contexts/count:
