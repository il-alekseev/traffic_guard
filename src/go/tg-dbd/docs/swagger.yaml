basePath: /
definitions:
  dto.DetectionStat:
    properties:
      accepted:
        type: integer
      denied:
        type: integer
      detected:
        type: integer
      unresolved:
        type: integer
    type: object
  dto.ErrorResponse:
    properties:
      error:
        description: Описание ошибки
        type: string
    type: object
  dto.ListResponse:
    properties:
      data:
        description: Список однотипных данных
      meta:
        allOf:
        - $ref: '#/definitions/dto.PaginationMeta'
        description: Метаданные пагинации
    type: object
  dto.PaginationMeta:
    properties:
      limit:
        description: Количество элементов на странице
        type: integer
      page:
        description: Текущая страница (начинается с 1)
        type: integer
      pages:
        description: Общее количество страниц
        type: integer
      total:
        description: Общее количество элементов
        type: integer
    type: object
  dto.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  models.Anomaly:
    properties:
      blocked_resources_count:
        type: integer
      firewalls_count:
        type: integer
      stat:
        items:
          $ref: '#/definitions/models.AnomalyResourse'
        type: array
    type: object
  models.AnomalyResourse:
    properties:
      resourse_name:
        type: string
      unblocked_requests:
        type: integer
    type: object
  models.CategoryCount:
    properties:
      category:
        type: string
      count:
        type: integer
    type: object
  models.DeviceStat:
    properties:
      name:
        type: string
      state:
        type: string
      statistics:
        items:
          $ref: '#/definitions/models.ResourcePoint'
        type: array
    type: object
  models.Notification:
    properties:
      dateTime:
        type: string
      description:
        type: string
      username:
        type: string
    type: object
  models.RequestPoint:
    properties:
      count:
        type: integer
      date:
        type: integer
    type: object
  models.RequestsStat:
    properties:
      accepted:
        items:
          $ref: '#/definitions/models.RequestPoint'
        type: array
      before_blocked:
        items:
          $ref: '#/definitions/models.RequestPoint'
        type: array
      blocked:
        items:
          $ref: '#/definitions/models.RequestPoint'
        type: array
      delayed:
        items:
          $ref: '#/definitions/models.RequestPoint'
        type: array
    type: object
  models.ResourcePoint:
    properties:
      date:
        type: integer
      delayed:
        type: integer
      locked:
        type: integer
    type: object
  models.TrafficPoint:
    properties:
      date:
        type: integer
      input:
        type: integer
      output:
        type: integer
    type: object
host: 127.0.0.1:7000
info:
  contact: {}
  description: API для получения дашбордов
  title: Dashboard API
  version: "1.0"
paths:
  /v1/dashboards/anomalies:
    get:
      description: Получение списка обнаруженных аномалий в сетевом трафике за указанный
        период
      parameters:
      - description: Начало периода в timestamp
        in: query
        name: start
        required: true
        type: integer
      - description: Конец периода в timestamp
        in: query
        name: end
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список обнаруженных аномалий
          schema:
            items:
              $ref: '#/definitions/models.Anomaly'
            type: array
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение информации об аномалиях
      tags:
      - dashboard
  /v1/dashboards/devices:
    get:
      description: Получение агрегированной статистики по сетевым узлам за указанный
        период
      parameters:
      - description: Начало периода в timestamp
        in: query
        name: start
        required: true
        type: integer
      - description: Конец периода в timestamp
        in: query
        name: end
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Статистика по устройствам
          schema:
            $ref: '#/definitions/models.DeviceStat'
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение статистики по устройствам
      tags:
      - dashboard
  /v1/dashboards/events:
    get:
      description: Получение списка уведомлений системы безопасности за указанный
        период
      parameters:
      - description: Начало периода в timestamp
        in: query
        name: start
        required: true
        type: integer
      - description: Конец периода в timestamp
        in: query
        name: end
        required: true
        type: integer
      - description: Количество возвращаемых уведомлений (по умолчанию 5)
        in: query
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список уведомлений
          schema:
            items:
              $ref: '#/definitions/models.Notification'
            type: array
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение списка уведомлений
      tags:
      - dashboard
  /v1/dashboards/proh_activity:
    get:
      description: Получение расписания запрещенной активности начиная с указанной
        даты
      parameters:
      - description: Дата начала в timestamp
        in: query
        name: start
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: График запрещенной активности
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение графика запрещенной активности
      tags:
      - dashboard
  /v1/dashboards/requests:
    get:
      description: Получение агрегированной статистики по HTTP-запросам за указанный
        период
      parameters:
      - description: Начало периода в timestamp
        in: query
        name: start
        required: true
        type: integer
      - description: Конец периода в timestamp
        in: query
        name: end
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Статистика HTTP-запросов
          schema:
            $ref: '#/definitions/models.RequestsStat'
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение статистики HTTP-запросов
      tags:
      - dashboard
  /v1/dashboards/resources:
    get:
      description: Получение топ ресурсов с указанием количества обращений за указанный
        период
      parameters:
      - description: Начало периода в timestamp
        in: query
        name: start
        required: true
        type: integer
      - description: Конец периода в timestamp
        in: query
        name: end
        required: true
        type: integer
      - description: Количество возвращаемых ресурсов (по умолчанию 5)
        in: query
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: JSON объект, где ключ - URL ресурса, значение - количество
            обращений
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение списка популярных ресурсов
      tags:
      - dashboard
  /v1/dashboards/top-categories:
    get:
      consumes:
      - application/json
      description: Возвращает наиболее часто встречаемые категории в сессиях с возможностью
        фильтрации
      parameters:
      - default: now-24h
        description: Начало временного диапазона
        in: query
        name: from
        type: string
      - default: now
        description: Конец временного диапазона
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по типу сессии
        in: query
        name: type
        type: string
      - default: 5
        description: Количество возвращаемых категорий
        in: query
        maximum: 50
        minimum: 1
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CategoryCount'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить топ категорий сессий
      tags:
      - analytics
  /v1/dashboards/traffic:
    get:
      description: Получение агрегированной статистики по сетевому трафику за указанный
        период
      parameters:
      - description: Начало периода в timestamp
        in: query
        name: start
        required: true
        type: integer
      - description: Конец периода в timestamp
        in: query
        name: end
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Статистика сетевого трафика
          schema:
            items:
              $ref: '#/definitions/models.TrafficPoint'
            type: array
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение статистики сетевого трафика
      tags:
      - dashboard
  /v1/detections:
    get:
      consumes:
      - application/json
      description: Возвращает список наиболее частых детекций за указанный временной
        период с пагинацией
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, 2023-12-01T10:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2023-12-01T11:00:00Z)'
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по категории
        in: query
        name: top_category
        type: string
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Количество записей на странице
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            $ref: '#/definitions/dto.ListResponse'
        "400":
          description: Неверный формат параметров
          schema:
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: object
      summary: Получить список топ выявлений
      tags:
      - Detections
  /v1/detections/stat:
    get:
      consumes:
      - application/json
      description: Возвращает статистику детекций по категориям (обнаружено, принято,
        отклонено, неразрешено) за указанный период
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, now-1h, 2024-01-01T00:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2024-01-01T00:00:00Z)'
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по категории
        in: query
        name: top_category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Статистика детекций
          schema:
            $ref: '#/definitions/dto.DetectionStat'
        "400":
          description: Неверный формат временного диапазона
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Ошибка при получении статистики выявлений
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получение статистики по детекциям
      tags:
      - detections
  /v1/healthcheck:
    get:
      description: Проверка, что сервер работает
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
      summary: Проверка работоспособности сервера
      tags:
      - utils
  /v1/sessions:
    get:
      consumes:
      - application/json
      description: Возвращает список сессий с возможностью фильтрации, поиска, сортировки
        и пагинации
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, 2023-12-01T10:00:00Z).
          По умолчанию: now-10m'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2023-12-01T12:00:00Z).
          По умолчанию: now'
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по категории
        in: query
        name: category
        type: string
      - description: Фильтр по типу сессии
        in: query
        name: type
        type: string
      - description: Поиск по частичному совпадению
        in: query
        name: search
        type: string
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Количество записей на странице
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: id
        description: Поле для сортировки
        in: query
        name: order_by
        type: string
      - default: desc
        description: Направление сортировки (asc/desc)
        enum:
        - asc
        - desc
        in: query
        name: order_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            $ref: '#/definitions/dto.ListResponse'
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить список сессий
      tags:
      - sessions
schemes:
- http
swagger: "2.0"
