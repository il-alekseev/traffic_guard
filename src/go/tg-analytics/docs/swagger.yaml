basePath: /
definitions:
  dto.Category:
    properties:
      access_count:
        type: integer
      name:
        type: string
    type: object
  dto.Detection:
    properties:
      action:
        type: string
      categorized_at:
        type: string
      category:
        type: string
      description:
        type: string
      domain:
        type: string
      host_name:
        type: string
      ip:
        type: string
      location:
        type: string
      port:
        type: integer
      request_count:
        type: integer
    type: object
  dto.DetectionStat:
    properties:
      accepted:
        type: integer
      denied:
        type: integer
      detected:
        type: integer
      unresolved:
        type: integer
    type: object
  dto.DeviceStatResponse:
    properties:
      count:
        type: integer
      data:
        additionalProperties:
          $ref: '#/definitions/models.DeviceRequestStat'
        type: object
      time:
        items:
          type: string
        type: array
    type: object
  dto.ErrorResponse:
    properties:
      error:
        description: Описание ошибки
        type: string
    type: object
  dto.GetAnomaliesResponse:
    properties:
      blocked_resourses_count:
        type: integer
      data:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      host_names_count:
        type: integer
    type: object
  dto.GetDetectionsResponse:
    properties:
      data:
        description: Список выявлений
        items:
          $ref: '#/definitions/dto.Detection'
        type: array
      meta:
        allOf:
        - $ref: '#/definitions/dto.PaginationMeta'
        description: Метаданные пагинации
    type: object
  dto.GetSessionsResponse:
    properties:
      data:
        description: Список сессий
        items:
          $ref: '#/definitions/dto.Session'
        type: array
      meta:
        allOf:
        - $ref: '#/definitions/dto.PaginationMeta'
        description: Метаданные пагинации
    type: object
  dto.PaginationMeta:
    properties:
      limit:
        description: Количество элементов на странице
        type: integer
      page:
        description: Текущая страница (начинается с 1)
        type: integer
      pages:
        description: Общее количество страниц
        type: integer
      total:
        description: Общее количество элементов
        type: integer
    type: object
  dto.RequestStatResponse:
    properties:
      count:
        description: Число точек с данными
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/models.RequestStat'
        description: Список однотипных данных
      type:
        description: Тип данных
        type: string
    type: object
  dto.Session:
    properties:
      category:
        type: string
      datetime_utc:
        type: string
      dst_country:
        type: string
      dst_ip:
        type: string
      dst_port:
        type: integer
      host_name:
        type: string
      id:
        type: integer
      proto:
        type: string
      src_country:
        type: string
      src_ip:
        type: string
      status:
        type: string
      type:
        type: string
      url:
        type: string
      username:
        type: string
    type: object
  dto.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  dto.TrafficStatResponse:
    properties:
      count:
        type: integer
      data:
        $ref: '#/definitions/models.TrafficStat'
    type: object
  dto.UnresolvedDetection:
    properties:
      domain:
        type: string
      requests_after:
        type: integer
      requests_all:
        type: integer
      requests_before:
        type: integer
    type: object
  models.AnomaliesListPage:
    properties:
      anomalies:
        additionalProperties:
          $ref: '#/definitions/models.AnomalyStat'
        type: object
    type: object
  models.AnomalyStat:
    properties:
      after_block:
        type: integer
      before_block:
        type: integer
      input:
        type: integer
      live_count:
        type: integer
      output:
        type: integer
      pending:
        type: integer
      requests:
        type: integer
    type: object
  models.DetectionReport:
    properties:
      all:
        type: integer
      allowed:
        type: integer
      blocked:
        type: integer
      unresolved:
        type: integer
    type: object
  models.DeviceAnalyticsPage:
    properties:
      all:
        type: integer
      allowed:
        $ref: '#/definitions/models.RequestStat'
      anomalies:
        type: integer
      blocked:
        $ref: '#/definitions/models.RequestStat'
      blocks:
        type: integer
      pending:
        $ref: '#/definitions/models.RequestStat'
      traffic:
        $ref: '#/definitions/models.TrafficStat'
    type: object
  models.DeviceReport:
    properties:
      all:
        type: integer
      anomalies:
        type: integer
      blocks:
        type: integer
      detections:
        $ref: '#/definitions/models.DetectionReport'
      input:
        type: integer
      output:
        type: integer
      requests:
        type: integer
    type: object
  models.DeviceRequestStat:
    properties:
      blocked:
        items:
          type: integer
        type: array
      pending:
        items:
          type: integer
        type: array
      status:
        type: string
    type: object
  models.DevicesAnalyticsPage:
    properties:
      analytics:
        additionalProperties:
          $ref: '#/definitions/models.DeviceReport'
        type: object
    type: object
  models.MainActivityPage:
    properties:
      top_categories:
        additionalProperties:
          $ref: '#/definitions/models.RequestReport'
        type: object
      top_resources:
        additionalProperties:
          $ref: '#/definitions/models.ResourceStat'
        type: object
      traffic:
        $ref: '#/definitions/models.TrafficStat'
    type: object
  models.Report:
    properties:
      anomalies_list_page:
        additionalProperties:
          $ref: '#/definitions/models.AnomaliesListPage'
        type: object
      device_analytics_page:
        $ref: '#/definitions/models.DevicesAnalyticsPage'
      from:
        type: string
      main_activity_page:
        $ref: '#/definitions/models.MainActivityPage'
      to:
        type: string
      top_anomalies_page:
        $ref: '#/definitions/models.TopAnomaliesPage'
      top_categories_page:
        additionalProperties:
          $ref: '#/definitions/models.TopCategoriesPage'
        type: object
    type: object
  models.ReportForDevice:
    properties:
      anomalies_list_page:
        additionalProperties:
          $ref: '#/definitions/models.AnomalyStat'
        type: object
      categories_page:
        additionalProperties:
          $ref: '#/definitions/models.TopCategory'
        type: object
      device_analytics_page:
        $ref: '#/definitions/models.DeviceAnalyticsPage'
      from:
        type: string
      host_name:
        type: string
      to:
        type: string
    type: object
  models.RequestReport:
    properties:
      after_block:
        type: integer
      before_block:
        type: integer
      pending:
        type: integer
    type: object
  models.RequestStat:
    properties:
      data:
        items:
          type: integer
        type: array
      time:
        items:
          type: string
        type: array
    type: object
  models.ResourceStat:
    properties:
      category:
        type: string
      stat:
        $ref: '#/definitions/models.RequestReport'
    type: object
  models.TopAnomaliesPage:
    properties:
      anomalies:
        additionalProperties:
          $ref: '#/definitions/models.TopAnomaly'
        type: object
    type: object
  models.TopAnomaly:
    properties:
      all:
        type: integer
      anomalies:
        type: integer
      blocks:
        type: integer
      detections:
        $ref: '#/definitions/models.DetectionReport'
      input:
        type: integer
      output:
        type: integer
      requests:
        type: integer
    type: object
  models.TopCategoriesPage:
    properties:
      categories:
        additionalProperties:
          $ref: '#/definitions/models.TopCategory'
        type: object
    type: object
  models.TopCategory:
    properties:
      after_block:
        type: integer
      before_block:
        type: integer
      input:
        type: integer
      output:
        type: integer
      pending:
        type: integer
      requests:
        type: integer
    type: object
  models.TrafficStat:
    properties:
      input:
        items:
          type: integer
        type: array
      output:
        items:
          type: integer
        type: array
      time:
        items:
          type: string
        type: array
    type: object
info:
  contact: {}
  description: API для аналитики
  title: Analytics API
  version: "1.0"
paths:
  /api/v1/categories:
    get:
      consumes:
      - application/json
      description: Возвращает список всех уникальных категорий контента из системы
      produces:
      - application/json
      responses:
        "200":
          description: Список категорий контента
          schema:
            items:
              type: string
            type: array
        "500":
          description: Ошибка при получении списка категорий
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получение списка категорий контента
      tags:
      - common
  /api/v1/dashboards/anomalies:
    get:
      description: Получение статистики об аномалиях за указанный период
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, 2023-12-01T10:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2023-12-01T12:00:00Z)'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Статистика обнаруженных аномалий
          schema:
            $ref: '#/definitions/dto.GetAnomaliesResponse'
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение информации об аномалиях
      tags:
      - dashboards
  /api/v1/dashboards/devices:
    get:
      description: Получение агрегированной статистики по сетевым узлам за указанный
        период
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, 2023-12-01T10:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2023-12-01T12:00:00Z)'
        in: query
        name: to
        type: string
      - default: 20
        description: Количество точек измерений
        in: query
        minimum: 1
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Статистика по устройствам
          schema:
            $ref: '#/definitions/dto.DeviceStatResponse'
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение статистики по устройствам
      tags:
      - dashboards
  /api/v1/dashboards/requests:
    get:
      consumes:
      - application/json
      description: Получение статистики запросов за указанный период с фильтрацией
        по хосту и типу запросов
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, now-1h, 2024-01-01T00:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2024-01-01T00:00:00Z)'
        in: query
        name: to
        type: string
      - default: pending
        description: Тип запроса
        enum:
        - allowed
        - blocked
        - before_block
        - pending
        in: query
        name: request_type
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - default: 10
        description: Количество интервалов
        in: query
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Статистика запросов (массив чисел)
          schema:
            $ref: '#/definitions/dto.RequestStatResponse'
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение статистики запросов
      tags:
      - dashboards
  /api/v1/dashboards/top-categories:
    get:
      consumes:
      - application/json
      description: Возвращает наиболее часто встречаемые категории в сессиях с возможностью
        фильтрации
      parameters:
      - default: now-24h
        description: Начало временного диапазона
        in: query
        name: from
        type: string
      - default: now
        description: Конец временного диапазона
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по типу сессии
        enum:
        - Разрешен
        - Заблокирован
        - VPN
        in: query
        name: type
        type: string
      - default: 5
        description: Количество возвращаемых категорий
        in: query
        maximum: 50
        minimum: 1
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.Category'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение списка самых запрашиваемых категорий
      tags:
      - dashboards
  /api/v1/dashboards/top-unresolved_detections:
    get:
      consumes:
      - application/json
      description: Возвращает список наиболее частых нерешенных выявлений за указанный
        временной период с возможностью фильтрации
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, 2023-12-01T10:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2023-12-01T12:00:00Z)'
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - default: 5
        description: Количество возвращаемых записей
        in: query
        minimum: 1
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ со списком нерешенных выявлений
          schema:
            items:
              $ref: '#/definitions/dto.UnresolvedDetection'
            type: array
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение списка топ нерешенных выявлений
      tags:
      - dashboards
  /api/v1/dashboards/traffic:
    get:
      consumes:
      - application/json
      description: Возвращает статистику трафика за указанный временной диапазон с
        заданным количеством точек данных в Кб
      parameters:
      - default: now-10m
        description: Начало временного диапазона в формате парсера времени (по умолчанию
          now-10m)
        in: query
        name: from
        type: string
      - default: now
        description: Конец временного диапазона в формате парсера времени (по умолчанию
          now)
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - default: 20
        description: Количество точек данных для возврата (по умолчанию 20)
        in: query
        minimum: 1
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ со статистикой трафика
          schema:
            $ref: '#/definitions/dto.TrafficStatResponse'
        "400":
          description: Неверный формат параметров запроса
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера при получении статистики
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение статистики трафика
      tags:
      - dashboards
  /api/v1/dashbords/act:
    get:
      consumes:
      - application/json
      description: Устанавливает действие (разрешить/заблокировать) для указанного
        домена
      parameters:
      - default: allow
        description: Тип действия
        enum:
        - allow
        - deny
        in: query
        name: action
        required: true
        type: string
      - description: Путь домена
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Действие успешно применено к домену
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Неверные параметры запроса
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Выполнение действия над доменом
      tags:
      - actions
  /api/v1/detections:
    get:
      consumes:
      - application/json
      description: Возвращает список выявлений за указанный временной период с пагинацией
        и фильтрацией
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, 2023-12-01T10:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2023-12-01T11:00:00Z)'
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по категории
        enum:
        - Агрессия
        - расизм
        - терроризм
        - Ботнеты
        - Веб-почта
        - Досуг и развлечения
        - Интернет-магазины
        - Компьютерные игры
        - Криптомайнинг
        - Наркотики
        - Порнография и секс
        - Прокси и анонимайзеры
        - Реестр запрещенных сайтов
        - Сайты для взрослых
        - Сайты распространяющие вирусы
        - Социальные сети
        - Торренты и Р2Р-сети
        - Файловые архивы
        - Фильмы и видео онлайн
        - Фишинг
        - Чаты и мессенджеры
        - Дополнительно
        - Криптоджекинг
        - Реклама
        - Онлайн-игры
        - Игровые платформы
        - Вредоносное ПО
        - Азартные игры
        - Депресивный контент и суицид
        - Алкоголь
        - табак
        in: query
        name: category
        type: string
      - description: Действие пользователя
        enum:
        - Разрешено
        - Заблокировано
        - Не решено
        in: query
        name: action
        type: string
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Количество записей на странице
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            $ref: '#/definitions/dto.GetDetectionsResponse'
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение списка выявлений
      tags:
      - detections
  /api/v1/detections/stat:
    get:
      consumes:
      - application/json
      description: Возвращает статистику выявлений за указанный период с фильтрацией
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, now-1h, 2024-01-01T00:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2024-01-01T00:00:00Z)'
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по категории
        enum:
        - Агрессия
        - расизм
        - терроризм
        - Ботнеты
        - Веб-почта
        - Досуг и развлечения
        - Интернет-магазины
        - Компьютерные игры
        - Криптомайнинг
        - Наркотики
        - Порнография и секс
        - Прокси и анонимайзеры
        - Реестр запрещенных сайтов
        - Сайты для взрослых
        - Сайты распространяющие вирусы
        - Социальные сети
        - Торренты и Р2Р-сети
        - Файловые архивы
        - Фильмы и видео онлайн
        - Фишинг
        - Чаты и мессенджеры
        - Дополнительно
        - Криптоджекинг
        - Реклама
        - Онлайн-игры
        - Игровые платформы
        - Вредоносное ПО
        - Азартные игры
        - Депресивный контент и суицид
        - Алкоголь
        - табак
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Статистика детекций
          schema:
            $ref: '#/definitions/dto.DetectionStat'
        "400":
          description: Неверный формат временного диапазона
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Ошибка при получении статистики выявлений
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение статистики по выявлениям
      tags:
      - detections
  /api/v1/devices:
    get:
      consumes:
      - application/json
      description: Возвращает список всех уникальных имен устройств (хостов) из системы
      produces:
      - application/json
      responses:
        "200":
          description: Список имен устройств
          schema:
            items:
              type: string
            type: array
        "500":
          description: Ошибка при получении имен устройств
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Полуечение списка имен устройств
      tags:
      - common
  /api/v1/reports:
    get:
      consumes:
      - application/json
      description: Генерирует полный отчет по активности за указанный временной период,
        включая аналитику по устройствам, категориям и аномалиям
      parameters:
      - default: now-24h
        description: 'Начало временного диапазона (формат: now-24h, 2023-12-01T10:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2023-12-01T12:00:00Z)'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Полный отчет по активности
          schema:
            $ref: '#/definitions/models.Report'
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера при генерации отчета
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Создание отчета
      tags:
      - reports
  /api/v1/reports/{hostname}:
    get:
      consumes:
      - application/json
      description: Генерирует детализированный отчет по конкретному сетевому устройству
        за указанный временной период, включая статистику трафика, аномалии и категории
        запросов
      parameters:
      - description: Имя сетевого устройства (хоста)
        in: path
        name: hostname
        required: true
        type: string
      - default: now-24h
        description: 'Начало временного диапазона (формат: now-24h, 2023-12-01T10:00:00Z)'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2023-12-01T12:00:00Z)'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Детализированный отчет по устройству
          schema:
            $ref: '#/definitions/models.ReportForDevice'
        "400":
          description: Неверный формат параметров или устройство не найдено
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Устройство не найдено в базе данных
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера при генерации отчета
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Создание отчета по конкретному устройству
      tags:
      - reports
  /api/v1/sessions:
    get:
      consumes:
      - application/json
      description: Возвращает список сессий с возможностью фильтрации, поиска, сортировки
        и пагинации
      parameters:
      - default: now-10m
        description: 'Начало временного диапазона (формат: now-10m, 2023-12-01T10:00:00Z).
          По умолчанию: now-10m'
        in: query
        name: from
        type: string
      - default: now
        description: 'Конец временного диапазона (формат: now, 2023-12-01T12:00:00Z).
          По умолчанию: now'
        in: query
        name: to
        type: string
      - description: Фильтр по имени хоста
        in: query
        name: hostname
        type: string
      - description: Фильтр по категории
        enum:
        - Неизвестный класс
        - Агрессия
        - расизм
        - терроризм
        - Ботнеты
        - Веб-почта
        - Досуг и развлечения
        - Интернет магазины
        - Компьютерные игры
        - Криптомайнинг
        - Наркотики
        - Порнография и секс
        - Прокси и анонимайзеры
        - Реестр запрещенных сайтов
        - Сайты для взрослых
        - Сайты распространяющие вирусы
        - Социальные сети
        - Торренты и Р2Р-сети
        - Файловые архивы
        - Фильмы и видео онлайн
        - Фишинг
        - Чаты и мессенджеры
        - Криптоджекинг
        - Реклама
        - Онлайн-игры
        - Игровые платформы
        - Вредоносное ПО
        - Азартные игры
        - Депрессивный контент
        - Алкоголь и табак
        - Положительная категория
        in: query
        name: category
        type: string
      - description: Фильтр по типу сессии
        enum:
        - Разрешен
        - Запрещен
        - VPN
        in: query
        name: type
        type: string
      - description: Поиск по URL или имени пользователя
        in: query
        name: search
        type: string
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Количество записей на странице
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: datetime_utc
        description: Поле для сортировки
        enum:
        - id
        - datetime_utc
        - type
        - status
        - url
        - proto
        - host_name
        - src_ip
        - src_country
        - username
        - dst_ip
        - dst_port
        - dst_country
        - category
        in: query
        name: order_by
        type: string
      - default: desc
        description: Направление сортировки (asc/desc)
        enum:
        - asc
        - desc
        in: query
        name: order_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            $ref: '#/definitions/dto.GetSessionsResponse'
        "400":
          description: Неверный формат параметров
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получение списка сессий
      tags:
      - sessions
